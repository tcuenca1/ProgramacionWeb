server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $servidor servidor:3000;
    set $estado servicio-estado:3000;
    access_log off;

    location /6A/ {
        proxy_pass http://$servidor$request_uri;
    }

    location = /estado {
        proxy_pass http://$estado$request_uri;
    }

    location /api-docs/ {
        proxy_pass http://$servidor$request_uri;
    }

    location = /api-docs {
        return 308 /api-docs/;
    }

    location = /openapi.json {
        proxy_pass http://$servidor$request_uri;
    }

    location / {
        return 404;
    }
}
